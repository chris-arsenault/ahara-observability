# What the deploy still resolves: public identifiers, not secrets.
#
# Every secret in this stack is read by the secret-fetch container at start,
# with the identity the trust appliance issued it, from paths declared in
# compose.yaml (ahara-trust ADR-0002). The two below are Cognito public
# identifiers that appear inside URLs the compose file builds, so they are
# interpolated rather than fetched. Replacing them with literals is a cleanup
# that needs the deployed values read once.
COGNITO_ISSUER: /ahara/observability/ingest-issuer
COGNITO_JWKS_URI: /ahara/observability/ingest-jwks-uri
INGEST_SCOPE: /ahara/observability/ingest-scope
GRAFANA_COGNITO_CLIENT_ID: /ahara/observability/grafana-cognito-client-id
